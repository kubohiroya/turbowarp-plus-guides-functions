    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 関数って、算数のテストに出る怖いやつ？ 今日は欠席します！
        seconds: 6.1
        styles:
          - lesson
    - Pura.say:
        text: 出席して。プログラムでは、ひとまとまりの仕事に名前をつけて、呼び出せるようにするんだ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: じゃあ「なんかいい感じにする」関数！ これ一本で完成！
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: 名前があいまいだと、頼む側が困るよ。「星を並べる」なら、何をするか想像できるね。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: 仕事を書くのが定義。使うのが呼び出し。レシピを書く人と、注文する人みたい！
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: そう。呼ぶ場所では、細かい手順より「今、何をしたいか」が見える。これが抽象化の役目だよ。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 一度しか使わない仕事は、関数にしちゃダメ？
        seconds: 4.8
        styles:
          - lesson
    - Pura.say:
        text: 一度でも、名前が考えを整理し、手順を読みやすくするなら役に立つ。回数だけでは決めないよ。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: Scratchなら「ブロック定義」だね。「星を並べる」で中の手順を隠せる！
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: うん。標準の定義ブロックは、動きなどを行う手続き。値を返す関数との違いも次で扱おう。
        seconds: 8.2
        styles:
          - lesson
    - Moko.say:
        text: プラがエディタの外側まで出張した！ 検索欄から「星を並べる」を探してみよう。
        seconds: 7.5
        styles:
          - lesson
