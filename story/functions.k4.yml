    - Moko.say:
        text: じゃあスプライトを動かすのも副作用？ 作品から全部消す？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 必要な働きだよ。大切なのは、何が変わるか分かること。副作用そのものが悪いわけじゃない。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 「料金を計算する」を呼んだら、点数がゼロになった。これはびっくり。
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: 名前から読めない変更は追いにくいね。計算と画面の更新を分けると、確かめる場所も絞れる。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 世界中の変数をこっそり読む関数は、材料がカッコに見えないね。
        seconds: 6.2
        styles:
          - lesson
    - Pura.say:
        text: 隠れた依存だね。必要な材料を明示し、共有状態は誰が変更するか決めると、調査しやすくなる。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 同じ引数なら、どの関数も同じ結果になるんでしょ？
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: 乱数や現在時刻、外の変数を読むと変わる場合がある。そうした依存を除いた純粋な計算なら予測しやすいよ。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 計算係と、スプライトを動かす係。役割を分けて、必要なところでつなげよう！
        seconds: 7.2
        styles:
          - lesson
