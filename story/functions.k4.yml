    - Moko.say:
        text: リファクタリングしたよ！ 星を並べるゲームが、巨大ロボに変身！
        seconds: 6.4
        styles:
          - lesson
    - Pura.say:
        text: それは仕様変更。リファクタリングは、外から見える振る舞いを保ったまま、中の構造を改善することだよ。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: まず現状を確かめる。次に名前を直す。もう一度確かめる。小さく進めるんだね。
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: そう。関数を取り出すなら、必要な入力や、変わる状態を確認してから移す。
        seconds: 7
        styles:
          - lesson
    - Moko.say:
        text: 似たコードを二つ発見！ 即座に共通関数にしよう。
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: 同じ知識やルールを表す重複かな？ たまたま形が似ているだけなら、無理にまとめると変更が絡み合うよ。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: 割引の計算と、ゲームのダメージ計算。掛け算が似ていても、変わる理由は違うかも。
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: いい例だね。共通化した後に条件や引数が増えすぎるなら、別の仕事を混ぜていないか見直そう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 動作確認と、差分を見る作業を組み合わせたいな。Gitなら何を変えたか読み返せる。
        seconds: 7.9
        styles:
          - lesson
    - Pura.say:
        text: ただしGitだけで正しさは分からない。テストや観察と一緒に使う。機能追加と構造整理も分けて進めよう。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 関数は短くするための呪文じゃない。読めて、確かめられて、変えやすい仕事の約束！
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: 自分の作品から、目的を一言で言える仕事を一つ探そう。入力、結果、影響を説明できたら、最初の一歩だよ。
        seconds: 9.5
        styles:
          - lesson
