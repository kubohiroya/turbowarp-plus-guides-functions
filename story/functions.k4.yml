        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 短い関数が良いらしいから、全ブロックを一個ずつ定義にしたよ！
        seconds: 6.2
        styles:
          - lesson
    - Pura.say:
        text: 細切れすぎると、全体を読むために行ったり来たり。長さだけでは良さを決められない。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: じゃあ、ゲームを作る処理も、セーブも、音楽も「全部やる」にまとめる！
        seconds: 6.9
        styles:
          - lesson
    - Pura.say:
        text: 両極端！ 一緒に理解し、一緒に変えたい仕事のまとまりを考えよう。これを凝集度というよ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 「星を並べる」は、並べ方の話。「音量を変える」は、音の話。変更の理由が違うね。
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: そう。呼ぶ側では並べる意図を示し、中では位置を計算して描く。必要ならその手順も分けよう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 引数が十個になったら、全部カッコに詰めればいい？
        seconds: 5.3
        styles:
          - lesson
    - Pura.say:
        text: 必要な材料か見直す合図だね。ただし「何個以内なら正解」という万能な数字はないよ。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: 個数と間隔なら、並べ方を試せる。練習ブロックの呼び出しが読める！
        seconds: 6.6
        styles:
          - lesson
    - Pura.say:
        text: 「関数れんしゅう」を開いてね。これからガイドでコードの場所を示すよ。呼び出しの数値を一つ変えてみよう。
        seconds: 9.6
        styles:
          - lesson
