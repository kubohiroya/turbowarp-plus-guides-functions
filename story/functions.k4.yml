    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 「料金を計算する」に、お金を入れたらジュースが出た！
        seconds: 5.6
        styles:
          - lesson
    - Pura.say:
        text: それは自動販売機。ここでは材料を引数で渡して、計算結果を戻り値として受け取ろう。
        seconds: 7.9
        styles:
          - lesson
    - Moko.say:
        text: 「料金」のカッコにある個数と単価は、材料の置き場所？
        seconds: 5.6
        styles:
          - lesson
    - Pura.say:
        text: 定義に書く受け取り口が仮引数。呼ぶときに渡す3や120が実引数だよ。
        seconds: 6.9
        styles:
          - lesson
    - Moko.say:
        text: 3個、1個120円なら360円！ 「360」って言えば、返したことになる？
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: セリフは画面への表示。戻り値は、呼んだ側が次の計算などに使える結果。行き先が違うんだ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 戻った360を「割引後の料金」の計算に渡せる。仕事をつなげられるね！
        seconds: 6.9
        styles:
          - lesson
    - Pura.say:
        text: 入力と出力をはっきりさせると、つなぎ方も、何を確かめるかも分かりやすい。
        seconds: 7.2
        styles:
          - lesson
    - Moko.say:
        text: でもScratchの標準の定義ブロック、丸い値としては使えないよ？
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: そのとおり。標準の定義ブロックには戻り値の仕組みがない。値を返す一般の関数と同じだと思わないでね。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: 変数で結果を受け渡す方法はあるけど、誰がいつ書くか、約束が必要になるんだね。
        seconds: 7.5
        styles:
          - lesson
    - Pura.say:
        text: そう。今日は入力を受け取る練習ブロックと、上の言語に依存しない料金の例を分けて考えよう。
        seconds: 8.5
        styles:
          - lesson
