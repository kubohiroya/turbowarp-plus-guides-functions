        scale: 9.5
    - Moko.say:
        text: テストした！ 料金(3,120)が360。宇宙のすべてを保証します！
        seconds: 6.9
        styles:
          - lesson
    - Pura.say:
        text: 一例の成功だけでは、すべては保証できないよ。まず入力と結果の約束、つまり契約を考えよう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 今回は、個数は0以上の整数、単価も0以上。料金は掛け算の結果だね。
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: その約束から、普通の例、ゼロ、一個などの境界を選ぶ。期待する結果は、実装とは別に考えるんだ。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: 個数がマイナスだったら、逆にお金がもらえる？
        seconds: 4.9
        styles:
          - lesson
    - Pura.say:
        text: どう扱うかは仕様次第。拒否する、対象外とするなどを決めよう。勝手に補正してよいとは限らない。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: バグが出た入力も、テストに残せるね。また同じバグが出たら気づける！
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: そう。テストを先に失敗させ、直したら成功するか確かめると、その不具合を検出できると分かる。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: Scratchなら、個数0、1、5で実行して動きを観察できる。自動チェックは結果の受け渡しも設計が要るね。
        seconds: 9.9
        styles:
          - lesson
    - Pura.say:
        text: 中の手順をそのまま写したテストでは、同じ勘違いをしがち。使う側が欲しい振る舞いを確かめよう。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: テストはお守りじゃなくて、約束と観察のセット。ぼくの漫才も毎回テスト……観客が厳しい！
        seconds: 8.3
        styles:
          - lesson
